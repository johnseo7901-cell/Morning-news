name: Daily Samsung E&A News Auto Update

on:
  schedule:
    # 매일 아침 한국 시간(KST) 06:15 자동 실행 (UTC 기준 21:15)
    - cron: '15 21 * * *'
  workflow_dispatch: # 웹에서 수동으로 즉시 테스트 실행 가능하도록 설정

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 뉴스 수집 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetchNews.js

      - name: 변경된 news.json 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Daily briefing $(date +'%Y-%m-%d')" && git push)
