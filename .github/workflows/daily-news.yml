name: Daily Samsung E&A News Auto Update

on:
  schedule:
    # 매일 한국 시간 오전 06:15 (UTC 21:15) 자동 실행
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 뉴스 수집 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetchNews.js

      - name: 변경된 news.json 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git commit -m "Auto update news briefing [skip ci]" || exit 0
          git push
